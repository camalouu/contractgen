services:
  yosys:
    container_name: yosys
    build: .
    user: "0:0"
    # image: gdnmhr/contractgen:latest
    volumes:
      - .:/home/yosys/resources
      - ../../..:/home/yosys/project
    # entrypoint: /bin/bash
    entrypoint: /home/yosys/resources/run.sh
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE

services:
  yosys:
    container_name: yosys
    build: .
    # `docker compose up` otherwise reuses an existing image even when the
    # Dockerfile gained runtime dependencies such as the Z3 Python venv.
    pull_policy: build
    user: "0:0"
    # image: gdnmhr/contractgen:latest
    volumes:
      - .:/home/yosys/resources
      - ../../..:/home/yosys/project
    # entrypoint: /bin/bash
    entrypoint: /home/yosys/resources/run.sh
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
